# 변경된 경로를 보고 PR에 라벨을 붙인다. 매핑은 .github/labeler.yml.
#
# pull_request_target을 쓰는 이유는 base 브랜치의 설정을 읽어야 라벨을 쓸 권한이
# 나오기 때문이다. 대신 이 워크플로가 main에 들어간 뒤의 PR부터 동작한다.
#
# 여기에 actions/checkout을 추가하지 말 것. pull_request_target은 권한이 높은
# 컨텍스트에서 도는데, PR 코드를 체크아웃하면 그 권한이 외부 코드에 노출된다.
# public 레포라 아무나 PR을 열 수 있으므로 teoto보다 실질적인 위험이다.
# labeler는 코드를 읽지 않으므로 체크아웃이 필요 없다.

name: Labeler

on: pull_request_target

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # 없는 라벨을 자동 생성
    steps:
      - uses: actions/labeler@v7
